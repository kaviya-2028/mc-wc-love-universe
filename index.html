
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC WC Love Universe ❤️</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#170716;color:#fff0f7;font-family:Georgia,serif}
button,input{font:inherit}
button{cursor:pointer;color:white;border:1px solid #ff9ec8;background:#ff397b30;
border-radius:25px;padding:12px 17px;margin:6px;transition:.25s}
button:hover{background:#ff397b70;box-shadow:0 0 20px #ff4388}
.page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;
justify-content:center;text-align:center;padding:28px 16px;position:relative;
overflow:hidden;background:radial-gradient(ellipse at top,#8f2457,#40132f 52%,#120716)}
.content{position:relative;z-index:2;width:100%;max-width:700px}
h1{font-size:clamp(33px,8vw,55px);color:#ffd8e8;
text-shadow:0 0 12px #ff4d98,0 0 30px #ff176b;line-height:1.25}
h2{color:#ffb8d6}
p{line-height:1.8}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:3px;color:#ffc5dc}
.hidden{display:none!important}
.heart{display:block;margin:25px auto;border:0;background:none;font-size:105px;
filter:drop-shadow(0 0 13px #ff174f) drop-shadow(0 0 30px #ff174f);
animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.16)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:23px 0}
.option{min-height:120px;border-radius:18px;background:#ffffff10;font-size:15px}
.option span{display:block;font-size:33px;margin-bottom:8px}
.card{padding:19px;border:1px solid #ff9fc666;border-radius:19px;
background:#260d25e8;margin:17px 0}
.star{position:fixed;color:#ffe4f0;pointer-events:none;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.2;transform:scale(.6)}}
.petal{position:fixed;top:-35px;z-index:5;pointer-events:none;
animation:fall linear forwards}
@keyframes fall{to{transform:translate(80px,110vh) rotate(600deg);opacity:0}}
.burst{position:fixed;z-index:20;pointer-events:none;animation:explode 1.6s forwards}
@keyframes explode{to{transform:translate(var(--x),var(--y)) scale(1.5);opacity:0}}
input[type=file]{max-width:100%;margin:15px;color:white}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos img{width:100%;height:220px;object-fit:cover;border-radius:14px;
border:1px solid #ff94bf;cursor:pointer}
#viewer{display:none;position:fixed;inset:0;background:#100612f7;z-index:999;
align-items:center;justify-content:center;flex-direction:column;padding:15px}
#viewer img{max-width:96%;max-height:82vh;object-fit:contain;border-radius:12px}
#countdown{font-size:clamp(20px,5vw,29px);line-height:1.9;color:#ffc6de}
#letter{white-space:pre-line;line-height:1.9;color:#ffe3ef}
.gift{font-size:100px;animation:beat 1s infinite}
.birthday-cake{font-size:100px;animation:cakeRise 1.2s ease-out;
filter:drop-shadow(0 0 20px #ff72b6)}
@keyframes cakeRise{from{transform:translateY(100px) scale(.3);opacity:0}
to{transform:translateY(0) scale(1);opacity:1}}
.candle{font-size:35px;display:inline-block;cursor:pointer;animation:flame .5s infinite alternate;
filter:drop-shadow(0 0 13px orange)}
@keyframes flame{to{transform:scale(1.25);filter:drop-shadow(0 0 23px gold)}}
.birthday-message{font-size:clamp(28px,7vw,43px);color:#ffe1ee;
text-shadow:0 0 12px #ff2e86,0 0 30px #ff0055;animation:appear .8s ease-out}
@keyframes appear{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.firework{position:fixed;z-index:1000;pointer-events:none;font-size:25px;
animation:firework 1.8s ease-out forwards}
@keyframes firework{to{transform:translate(var(--fx),var(--fy)) scale(1.8) rotate(180deg);opacity:0}}
.scene{font-size:clamp(43px,12vw,65px);padding:30px 5px;border-radius:18px;
background:linear-gradient(145deg,#54234d,#bd658b,#39204c)}
.dialogue{white-space:pre-line;font-size:17px;line-height:1.9}
@media(max-width:380px){.grid{gap:7px}.option{font-size:13px;padding:10px 3px}.photos img{height:155px}}
</style>
</head>

<body>
<div id="stars"></div>

<!-- FIRST WELCOME PAGE -->
<section class="page" id="welcome">
<div class="content">
<p class="eyebrow">✧ A UNIVERSE MADE FOR TWO ✧</p>
<h1>Welcome to Our<br>Love Universe 💗</h1>
<p>MC <span style="color:#ff90bc">♥</span> WC</p>
<p class="eyebrow">──── ♡ ✦ ♡ ────</p>
<p>In every universe, my heart finds you. ✨</p>
<button class="heart" id="start" aria-label="Enter Love Universe">❤️</button>
<p class="eyebrow">TOUCH OUR GLOWING HEART</p>
</div>
</section>

<!-- MAIN MENU -->
<section class="page hidden" id="home">
<div class="content">
<p class="eyebrow">♡ OUR FOREVER STORY ♡</p>
<h1>MC WC<br><span style="font-style:italic">Love Universe</span></h1>
<p>Two hearts, one beautiful universe. 💕</p>
<div class="grid">
<button class="option" onclick="openFeature('memories')"><span>📸</span>Love Memories<br>& Photos</button>
<button class="option" onclick="openFeature('gift')"><span>🎁</span>Animated<br>Surprise Gift</button>
<button class="option" onclick="openFeature('birthday')"><span>🎂</span>MC Birthday<br>October 28</button>
<button class="option" onclick="openFeature('letter')"><span>💌</span>Secret Love<br>Letter</button>
</div>
<button onclick="openFeature('story')">🌸 Our Anime Love Story</button>
<button id="musicButton" onclick="toggleMusic()">🎶 Play Romantic Music</button>
<p class="eyebrow">✨ FOREVER US ✨</p>
</div>
</section>

<!-- FEATURES PAGE -->
<section class="page hidden" id="details">
<div class="content">
<p class="eyebrow">♡ JUST FOR YOU ♡</p>
<h1 id="featureTitle">Our Story</h1>
<div id="featureBody"></div>
<button onclick="goHome()">← Back to Love Universe</button>
</div>
</section>

<!-- FULL SCREEN PHOTO -->
<div id="viewer" onclick="if(event.target===this)closeViewer()">
<img id="largePhoto" alt="Love memory">
<button onclick="closeViewer()">✕ Close Photo</button>
</div>

<script>
const $=id=>document.getElementById(id);
const pageIds=["welcome","home","details"];
let musicOn=false,audio=null,musicTimer=null,noteIndex=0,episode=0,photoURLs=[];

function showPage(id){
pageIds.forEach(p=>$(p).classList.add("hidden"));
$(id).classList.remove("hidden");
window.scrollTo(0,0);
}
function sound(){
try{
audio=audio||new(window.AudioContext||window.webkitAudioContext)();
audio.resume();
const o=audio.createOscillator(),g=audio.createGain();
o.type="sine";o.frequency.value=760;
g.gain.setValueAtTime(.05,audio.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);
o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.25);
}catch(e){}
}
function heartBurst(){
const symbols=["💗","💕","❤️","💖","✨","🌸","♡"];
for(let i=0;i<70;i++){
const el=document.createElement("span");el.className="burst";
el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
el.style.left="50%";el.style.top="50%";
const a=Math.random()*Math.PI*2,d=60+Math.random()*280;
el.style.setProperty("--x",Math.cos(a)*d+"px");
el.style.setProperty("--y",Math.sin(a)*d+"px");
el.style.fontSize=(12+Math.random()*20)+"px";
document.body.appendChild(el);setTimeout(()=>el.remove(),1700);
}
}
$("start").onclick=()=>{sound();heartBurst();setTimeout(()=>showPage("home"),500)};

// Stars and falling petals
for(let i=0;i<40;i++){
const s=document.createElement("span");s.className="star";
s.textContent=Math.random()>.5?"✦":"✧";
s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";
s.style.animationDelay=Math.random()*3+"s";s.style.fontSize=(10+Math.random()*20)+"px";
$("stars").appendChild(s);
}
setInterval(()=>{
const p=document.createElement("span");p.className="petal";
p.textContent=["🌸","💗","🌷","💕"][Math.floor(Math.random()*4)];
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(7+Math.random()*8)+"s";
document.body.appendChild(p);setTimeout(()=>p.remove(),16000);
},1000);

function goHome(){showPage("home")}

function openFeature(type){
sound();showPage("details");
const title=$("featureTitle"),body=$("featureBody");

if(type==="memories"){
title.textContent="📸 Our Love Memories";
body.innerHTML=`<div class="card">
<p>Every picture holds a piece of our love. 💗</p>
<p>Choose your photos below. Touch a photo to view it full screen.</p>
<input id="photoInput" type="file" accept="image/*" multiple>
<div id="photoGrid" class="photos"></div>
</div>`;
$("photoInput").onchange=e=>{
photoURLs.forEach(url=>URL.revokeObjectURL(url));photoURLs=[];
$("photoGrid").innerHTML="";
Array.from(e.target.files).forEach(file=>{
const url=URL.createObjectURL(file);photoURLs.push(url);
const img=document.createElement("img");img.src=url;img.alt="Our love memory";
img.onclick=()=>{$("largePhoto").src=url;$("viewer").style.display="flex"};
$("photoGrid").appendChild(img);
});
};
}

if(type==="gift"){
title.textContent="🎁 Birthday Surprise for MC";
body.innerHTML=`<div class="card">
<p id="giftHint">A special surprise is waiting for MC! 💗</p>
<div class="gift" id="giftBox">🎁</div>
<button id="openGift">OPEN YOUR GIFT 💝</button>
<div id="cakeArea"></div>
<div id="birthdayGreeting"></div>
</div>`;

$("openGift").onclick=()=>{
sound();
$("giftBox").style.display="none";
$("openGift").style.display="none";
$("giftHint").textContent="SURPRISE, MY DEAR MC! 🎉";
$("cakeArea").innerHTML=`
<div style="color:#ffc4df">✨ A cake made with love ✨</div>
<div class="birthday-cake">🎂</div>
<p>Touch the candle flame! 🕯️</p>
<div class="candle" id="candle" role="button" tabindex="0">🔥</div>`;
const flame=$("candle");
function celebrate(){
const greeting=$("birthdayGreeting");
if(greeting.dataset.done==="yes")return;
greeting.dataset.done="yes";sound();
greeting.innerHTML=`
<h2 class="birthday-message">🎆 Happy Birthday<br>My Dear Porukii ❤️</h2>
<p style="font-size:21px">MC ❤️ WC 💋</p>
<p>You are loved more than words can say! 💖</p>`;
flame.textContent="✨";fireworks();
}
flame.onclick=celebrate;
flame.onkeydown=e=>{
if(e.key==="Enter"||e.key===" "){e.preventDefault();celebrate()}
};
};
}

if(type==="birthday"){
title.textContent="🎂 MC's Birthday";
body.innerHTML=`<div class="card">
<div style="font-size:65px">🎂🎉🎆</div>
<p>Counting down to October 28!</p>
<div id="countdown">Loading...</div>
<p>Happy Birthday, MC! ❤️</p>
<p>WC's favourite person deserves all the happiness in the universe. 💗</p>
</div>`;
updateBirthday();
}

if(type==="letter"){
title.textContent="💌 Secret Love Letter";
body.innerHTML=`<div class="card">
<div style="font-size:55px">💌</div>
<p>A little secret from WC's heart...</p>
<button id="openLetter">OPEN MY LETTER 💗</button>
<div id="letter"></div></div>`;
$("openLetter").onclick=()=>{
sound();
$("letter").textContent=
"My dearest MC, ❤️\n\nYou make ordinary days feel magical. Your smile is my favourite sight, and every moment with you becomes a memory I want to keep forever.\n\nNo matter where life takes us, I hope we keep choosing each other, again and again. You are my favourite hello and my sweetest forever.\n\nWith all my love,\nWC ❤️";
$("openLetter").textContent="FOREVER YOURS 💖";
};
}
if(type==="story"){episode=0;renderEpisode()}
}

function closeViewer(){$("viewer").style.display="none";$("largePhoto").src=""}

function updateBirthday(){
const now=new Date();let target=new Date(now.getFullYear(),9,28);
if(now>=target)target=new Date(now.getFullYear()+1,9,28);
const d=target-now,el=$("countdown");if(!el)return;
el.textContent=`${Math.floor(d/86400000)} days ${Math.floor(d%86400000/3600000)} hours ${Math.floor(d%3600000/60000)} min ${Math.floor(d%60000/1000)} sec`;
}
setInterval(updateBirthday,1000);

function fireworks(){
const symbols=["🎆","✨","💖","🎇","💕","🌟","❤️"];
for(let i=0;i<100;i++){
setTimeout(()=>{
const f=document.createElement("span");f.className="firework";
f.textContent=symbols[Math.floor(Math.random()*symbols.length)];
f.style.left=(5+Math.random()*90)+"vw";
f.style.top=(10+Math.random()*65)+"vh";
f.style.setProperty("--fx",(Math.random()*220-110)+"px");
f.style.setProperty("--fy",(Math.random()*220-110)+"px");
document.body.appendChild(f);setTimeout(()=>f.remove(),1900);
},i*22);
}
}

const episodes=[
["💕 Episode 1 — The Beginning","🌸 👦🏻 💗 👧🏻 🌸","MC: The day I met you, my world became brighter.\nWC: And you became my favourite hello. 💗"],
["🌧️ Episode 2 — Little Moments","🌧️ ☂️ 👫 💕","WC: Even rainy days feel lovely with you.\nMC: Then I will always be your sunshine. ☀️"],
["🌅 Sunset Dreams","🌅 👫 🌷","MC: Let's collect a million beautiful memories.\nWC: As long as I have you beside me. 💖"],
["🌌 Episode 3 — Forever Us","🌌 ✨ 💑 ❤️","WC: Will you stay beside me through every chapter?\nMC: Every chapter, every season, forever. ❤️"],
["🎂 Birthday Special","🎂 🎉 🎆 💖","MC: Happy birthday, my dear Porukii! May your life be full of happiness and love. 💗"]
];
function renderEpisode(){
const ep=episodes[episode];$("featureTitle").textContent=ep[0];
$("featureBody").innerHTML=`<div class="card">
<div class="scene">${ep[1]}</div>
<p class="dialogue" id="dialogue"></p>
<button id="read">🔊 Read Dialogue</button>
<button id="next">${episode===episodes.length-1?"Start Again ↻":"Next Scene ➜"}</button>
</div>`;
$("dialogue").textContent=ep[2];
$("read").onclick=()=>{
if(!("speechSynthesis" in window)){alert("Voice not supported in this browser.");return}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(ep[2].replace("\n"," "));
u.rate=.88;u.pitch=1.15;speechSynthesis.speak(u);
};
$("next").onclick=()=>{episode=(episode+1)%episodes.length;renderEpisode();sound()};
}

function toggleMusic(){
if(musicOn){
musicOn=false;clearTimeout(musicTimer);
if(audio)audio.suspend();
$("musicButton").textContent="🎶 Play Romantic Music";return;
}
try{
audio=audio||new(window.AudioContext||window.webkitAudioContext)();
audio.resume();musicOn=true;
$("musicButton").textContent="🔇 Stop Romantic Music";
playMelody();
}catch(e){alert("Audio not available in this browser.")}
}
function playMelody(){
if(!musicOn||!audio)return;
const notes=[261.63,329.63,392,329.63,293.66,349.23,392,349.23];
const o=audio.createOscillator(),g=audio.createGain();
o.type="sine";o.frequency.value=notes[noteIndex++%notes.length];
g.gain.setValueAtTime(.0001,audio.currentTime);
g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.12);
g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.6);
o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.65);
musicTimer=setTimeout(playMelody,650);
}
</script>
</body>
</html>
